name: iOS build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: xcodebuild -project SHADOWFILES.xcodeproj -scheme SHADOWFILES -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SHADOWFILES.app Payload/
          /usr/bin/zip -qry SHADOWFILES-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SHADOWFILES-unsigned-ipa
          path: SHADOWFILES-unsigned.ipa
          if-no-files-found: error
