name: Backend
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - run: swift test
