name: SHADOWFILES
options:
  bundleIdPrefix: com.greywood.shadowfiles
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to a SHADOW FILES multiplayer server on your network.
    INFOPLIST_KEY_NSCameraUsageDescription: Camera access is reserved for future evidence photography.
    CODE_SIGNING_ALLOWED: NO
targets:
  SHADOWFILES:
    type: application
    platform: iOS
    sources:
      - path: SHADOWFILES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greywood.shadowfiles
        INFOPLIST_KEY_CFBundleDisplayName: SHADOW FILES
        INFOPLIST_KEY_UIInterfaceOrientation~ipad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
